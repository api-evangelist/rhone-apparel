aid: rhone-apparel
name: Rhone Apparel
description: >-
  Rhone Apparel, Inc. is a direct-to-consumer men's premium performance apparel and activewear brand
  founded in 2014 by brothers Nate and Ben Checketts and headquartered in Stamford, Connecticut. It
  sells through its own storefront, wholesale partners including Nordstrom and Bloomingdale's, and
  its own retail locations. Rhone runs no developer program and publishes no OpenAPI, SDK or API
  documentation. It does, however, operate a real and reachable agent-commerce surface: its Shopify
  storefront serves a store-specific llms.txt and agents.md, a Universal Commerce Protocol (UCP)
  merchant profile at /.well-known/ucp, an anonymous MCP endpoint exposing 13 catalog, cart,
  checkout and order tools with full JSON Schema inputSchemas, and Shopify Customer Accounts OIDC
  discovery branded on account.rhone.com. The company is profiled here as an agent-commerce
  participant rather than an API producer.
