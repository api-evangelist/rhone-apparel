apis:
- name: Rhone UCP Commerce (MCP)
  description: >-
    Rhone's agent-facing commerce surface, implementing the Universal Commerce Protocol over MCP
    (JSON-RPC 2.0). Thirteen tools cover catalog search and lookup, product detail, cart create /
    update / cancel, checkout create / update / complete / cancel, and order read. tools/list is
    anonymous and returns full JSON Schema inputSchemas; tools/call requires a resolvable UCP agent
    profile URI, and complete_checkout additionally requires an idempotency key. Rhone's own
    robots.txt and llms.txt state that payment must never be completed without contemporaneous
    human approval. Platform-provided by Shopify, served from Rhone-controlled hosts and scoped to
    Rhone's own catalog and orders.
  humanURL: https://rhone.myshopify.com/llms.txt
  baseURL: https://rhone.myshopify.com/api/ucp/mcp
