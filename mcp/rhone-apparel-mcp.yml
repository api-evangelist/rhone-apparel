generated: '2026-08-26'
method: probed
source: https://rhone.myshopify.com/api/ucp/mcp
status: published
note: >-
  Rhone runs its store on Shopify, and the Shopify platform exposes a Universal Commerce Protocol
  (UCP) MCP endpoint per merchant. The endpoint below is Rhone's own store instance - it serves
  Rhone's catalog, carts, checkouts and orders - and Rhone's own /llms.txt, /agents.md and
  /robots.txt all name it as the sanctioned way for agents to transact. It is platform-provided,
  not merchant-authored; recorded as a real agent surface Rhone serves, with that provenance stated.
  tools/list is anonymous and returned 13 tools with full JSON Schema inputSchemas (saved verbatim
  to rhone-apparel-mcp-tools.json). tools/call additionally requires a resolvable UCP agent profile
  URI in params.meta['ucp-agent'].profile; without one the server returns JSON-RPC -32001
  / data.code invalid_profile_url over HTTP 422.
deployment:
  mode: remote
  endpoint: https://rhone.myshopify.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    Rhone's llms.txt and robots.txt advertise the endpoint at
    https://checkout.rhone.com/api/ucp/mcp. That brand host sits behind a Cloudflare managed
    challenge and returned 403 to every probe, so the reachable, verified endpoint is the
    equivalent path on the Shopify shop host recorded above.
server:
  name: rhone-ucp
  transport: http
  protocol: MCP over JSON-RPC 2.0
  url: https://rhone.myshopify.com/api/ucp/mcp
  advertised_url: https://checkout.rhone.com/api/ucp/mcp
  api_version: '2026-04-08'
  api_version_header: x-shopify-ucp-mcp-api-version
